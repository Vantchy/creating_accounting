<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感卡片墙</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" media="print" onload="this.media='all'">
  <style>
    /* ============================================
       CSS Variables — 严格对接前端风格指南
       ============================================ */
    :root {
      /* 主色 */
      --color-primary: #000000;
      --color-secondary: #000000;

      /* 中性色 */
      --color-text: #212121;
      --color-text-soft: #555555;
      --color-text-secondary: #8a8a8a;
      --color-text-muted: #aaaaaa;
      --color-border: #d8d8d8;
      --color-border-soft: #e4e4e4;
      --color-accent-gray: #d3d3d3;
      --color-bg-page: #fafafa;
      --color-bg: #ffffff;
      --color-bg-soft: #f2f2f2;
      --color-bg-overlay: #ebebeb;
      --color-accent: #7d93a8;
      --color-accent-soft: #edf0f4;

      /* 功能色 */
      --color-success: #22c55e;
      --color-warning: #f59e0b;
      --color-error: #ef4444;

      /* 字体 */
      --font-display: "LXGW WenKai", "Noto Serif SC", "Songti SC", "STSong", SimSun, serif;
      --font-serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "LXGW WenKai", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-family: var(--font-serif);
      --font-family-ui: var(--font-sans);

      /* 字号 */
      --text-xs: 0.8125rem;
      --text-sm: 0.9375rem;
      --text-base: 1.125rem;
      --text-2xl: 1.375rem;
      --text-3xl: 1.875rem;
      --text-4xl: 2.75rem;

      /* 行高 */
      --leading-tight: 1.3;
      --leading-normal: 1.6;
      --leading-relaxed: 1.8;

      /* 字间距 */
      --tracking-tight: 0.01em;
      --tracking-normal: 0.02em;
      --tracking-wide: 0.03em;
      --tracking-wider: 0.05em;

      /* 字重 */
      --font-normal: 400;
      --font-medium: 500;
      --font-semibold: 600;
      --font-bold: 700;

      /* 间距 */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-12: 3rem;
      --space-16: 4rem;

      /* 圆角 */
      --radius-sm: 0.25rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-full: 9999px;

      /* 阴影 */
      --shadow-sm: 0 1px 2px rgba(33, 33, 33, 0.06);
      --shadow-md: 0 2px 8px rgba(33, 33, 33, 0.10);
      --shadow-lg: 0 8px 24px rgba(33, 33, 33, 0.14);

      /* 缓动 */
      --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-out: cubic-bezier(0, 0, 0.2, 1);
      --duration-fast: 150ms;
      --duration-normal: 250ms;
      --duration-slow: 400ms;

      /* 本项目特有变量 */
      --masonry-gap: var(--space-4);
      --card-radius: var(--radius-lg);
      --header-height: 60px;
    }

    /* ============================================
       Reset & Base (风格指南 8.1)
       ============================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-family);
      font-size: var(--text-base);
      line-height: var(--leading-relaxed);
      letter-spacing: var(--tracking-normal);
      color: var(--color-text);
      background-color: var(--color-bg-page);
      display: flex;
      flex-direction: column;
    }
    button, input, select, textarea, .ui {
      font-family: var(--font-family-ui);
    }

    /* ============================================
       Header
       ============================================ */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-6);
      padding: 14px 32px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border-soft);
      z-index: 10;
      flex-shrink: 0;
      flex-wrap: wrap;
      min-height: var(--header-height);
    }
    .header-logo {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--color-text);
      letter-spacing: var(--tracking-wide);
      white-space: nowrap;
    }
    .header-center {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    /* 线性图标通用 */
    .icon-svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      vertical-align: middle;
    }
    .icon-svg-lg {
      width: 22px;
      height: 22px;
      stroke-width: 1.6;
    }

    /* 自动滚动开关 */
    .scroll-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border-soft);
      background: var(--color-bg);
      color: var(--color-text-secondary);
      font-size: var(--text-xs);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-in-out);
      white-space: nowrap;
      font-family: var(--font-family-ui);
      line-height: 1.5;
    }
    .scroll-toggle:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .scroll-toggle.active {
      background: var(--color-accent-soft);
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .scroll-toggle .toggle-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-text-muted);
      transition: background var(--duration-fast);
    }
    .scroll-toggle.active .toggle-dot {
      background: var(--color-accent);
    }

    /* Search — 风格指南 5.4 表单元素 */
    .search-wrap {
      position: relative;
    }
    .search-wrap input {
      width: 200px;
      padding: 7px 12px 7px 34px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text);
      font-size: var(--text-sm);
      outline: none;
      transition: border-color var(--duration-normal) var(--ease-in-out),
                  width 0.3s var(--ease-in-out);
    }
    .search-wrap input::placeholder { color: var(--color-text-muted); }
    .search-wrap input:focus {
      border-color: var(--color-accent);
      width: 260px;
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }
    .search-clear {
      display: none;
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      transition: color var(--duration-fast);
    }
    .search-clear:hover { color: var(--color-text); }
    .search-wrap.has-text .search-clear { display: block; }

    /* Btn — 风格指南 5.1 */
    .btn {
      padding: 7px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: background var(--duration-fast) var(--ease-in-out),
                  border-color var(--duration-fast) var(--ease-in-out),
                  transform var(--duration-fast) var(--ease-in-out);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      line-height: 1.5;
    }
    .btn:hover {
      background: var(--color-bg-soft);
      border-color: var(--color-text-secondary);
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--color-accent-soft);
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .btn-primary:hover {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: #fff;
    }
    .btn-danger {
      color: var(--color-error);
      border-color: rgba(239, 68, 68, 0.25);
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.06);
      border-color: var(--color-error);
    }

    /* ============================================
       Masonry Wall
       ============================================ */
    .wall-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    /* 上下渐变遮罩（淡出效果） */
    .wall-wrap::before,
    .wall-wrap::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 48px;
      z-index: 2;
      pointer-events: none;
    }
    .wall-wrap::before {
      top: 0;
      background: linear-gradient(to bottom, var(--color-bg-page) 0%, transparent 100%);
    }
    .wall-wrap::after {
      bottom: 0;
      background: linear-gradient(to top, var(--color-bg-page) 0%, transparent 100%);
    }
    .wall-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      padding: 32px 32px 40px;
      column-count: 5;
      column-gap: var(--masonry-gap);
      will-change: transform;
    }
    @media (max-width: 1400px) { .wall-track { column-count: 4; } }
    @media (max-width: 1100px) { .wall-track { column-count: 3; } }
    @media (max-width: 800px)  { .wall-track { column-count: 2; } }
    @media (max-width: 500px)  { .wall-track { column-count: 1; } }

    /* ============================================
       Card — 风格指南 5.2 卡片
       ============================================ */
    .card {
      break-inside: avoid;
      margin-bottom: var(--masonry-gap);
      background: var(--color-bg);
      border-radius: var(--card-radius);
      border: 1px solid var(--color-border-soft);
      box-shadow: var(--shadow-md);
      padding: 20px 22px;
      cursor: pointer;
      transition: transform var(--duration-normal) var(--ease-out),
                  box-shadow var(--duration-normal) var(--ease-out),
                  border-color var(--duration-normal) var(--ease-out);
      animation: cardEntrance 0.5s var(--ease-out) both;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--color-border);
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: var(--font-semibold);
      line-height: var(--leading-tight);
      color: var(--color-text);
      margin-bottom: 8px;
      letter-spacing: var(--tracking-tight);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .card-content {
      font-family: var(--font-family);
      font-size: 14px;
      line-height: 1.7;
      color: var(--color-text-soft);
      display: -webkit-box;
      -webkit-line-clamp: 8;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--color-border-soft);
    }
    .card-date {
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .card-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid var(--color-border-soft);
      flex-shrink: 0;
    }

    /* 搜索高亮 */
    .highlight {
      background: #fef3c7;
      color: var(--color-text);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* 空状态 */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      gap: var(--space-4);
      pointer-events: none;
      z-index: 1;
    }
    .empty-state .icon { font-size: 48px; opacity: 0.4; }
    .empty-state .text { font-size: var(--text-sm); }

    /* 底部提示条 */
    .hint-bar {
      flex-shrink: 0;
      text-align: center;
      padding: 6px 0 12px;
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      letter-spacing: var(--tracking-tight);
    }

    /* ============================================
       FAB — 风格指南按钮风格
       ============================================ */
    .fab {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text);
      font-size: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      transition: transform var(--duration-fast) var(--ease-in-out),
                  box-shadow var(--duration-fast) var(--ease-in-out);
      z-index: 50;
      font-family: var(--font-family-ui);
    }
    .fab:hover {
      transform: scale(1.08);
      box-shadow: var(--shadow-lg);
    }
    .fab:active { transform: scale(0.95); }

    /* ============================================
       Modal Base
       ============================================ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal {
      background: var(--color-bg);
      border-radius: var(--radius-xl);
      border: 1px solid var(--color-border-soft);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px 32px;
      animation: modalSlideUp 0.25s var(--ease-out);
    }
    .modal-wide { max-width: 600px; }
    .modal-narrow { max-width: 380px; }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .modal-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: var(--font-semibold);
      color: var(--color-text);
      letter-spacing: var(--tracking-tight);
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--color-text-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-md);
      transition: background var(--duration-fast), color var(--duration-fast);
      font-family: var(--font-family-ui);
    }
    .modal-close:hover {
      background: var(--color-bg-soft);
      color: var(--color-text);
    }

    /* ============================================
       Form — 风格指南 5.4
       ============================================ */
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: var(--text-sm);
      color: var(--color-text-soft);
      margin-bottom: 6px;
      font-weight: var(--font-medium);
      letter-spacing: var(--tracking-tight);
    }
    .form-input,
    .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text);
      font-size: var(--text-sm);
      font-family: var(--font-family-ui);
      outline: none;
      transition: border-color var(--duration-normal) var(--ease-in-out);
    }
    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--color-accent);
    }
    .form-textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.7;
      font-family: var(--font-family);
    }

    /* ============================================
       Color Picker — 莫兰迪色系
       ============================================ */
    .color-preset-label {
      font-size: var(--text-sm);
      color: var(--color-text-soft);
      margin-bottom: 8px;
      letter-spacing: var(--tracking-tight);
    }
    .color-preset-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .color-preset-swatch {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: border-color var(--duration-fast) var(--ease-in-out),
                  transform var(--duration-fast) var(--ease-in-out);
      position: relative;
      box-shadow: var(--shadow-sm);
    }
    .color-preset-swatch:hover { transform: scale(1.1); z-index: 1; }
    .color-preset-swatch.active {
      border-color: var(--color-text);
      box-shadow: 0 0 0 1px var(--color-bg), 0 0 0 3px var(--color-text);
    }

    /* ============================================
       Detail Modal
       ============================================ */
    .detail-body { margin-bottom: 20px; }
    .detail-card-preview {
      width: 100%;
      min-height: 160px;
      border-radius: var(--card-radius);
      padding: 24px;
      border: 1px solid var(--color-border-soft);
      background: var(--color-bg);
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }
    .detail-card-preview .detail-preview-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: var(--font-semibold);
      color: var(--color-text);
      margin-bottom: 12px;
      line-height: var(--leading-tight);
      letter-spacing: var(--tracking-tight);
    }
    .detail-card-preview .detail-preview-content {
      font-family: var(--font-family);
      font-size: var(--text-sm);
      line-height: 1.8;
      color: var(--color-text-soft);
      word-break: break-word;
      white-space: pre-wrap;
    }
    .detail-card-preview .detail-preview-meta {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--color-border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
    }
    .detail-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* ============================================
       Confirm Dialog
       ============================================ */
    .confirm-dialog {
      text-align: center;
      padding: 8px 0;
    }
    .confirm-dialog .confirm-icon {
      font-size: 44px;
      margin-bottom: 12px;
    }
    .confirm-dialog .confirm-text {
      font-size: var(--text-base);
      color: var(--color-text);
      margin-bottom: 4px;
    }
    .confirm-dialog .confirm-sub {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-bottom: 24px;
    }
    .confirm-dialog .confirm-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    /* ============================================
       Scrollbar (Modal & Static mode)
       ============================================ */
    .modal::-webkit-scrollbar { width: 4px; }
    .modal::-webkit-scrollbar-track { background: transparent; }
    .modal::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }

    .wall-wrap.static-mode .wall-track {
      position: relative;
      padding-bottom: 80px;
    }

    /* ============================================
       Responsive
       ============================================ */
    @media (max-width: 768px) {
      .header {
        padding: 12px 16px;
        gap: var(--space-3);
      }
      .header-logo { font-size: 18px; }
      .header-center { gap: var(--space-2); }
      .search-wrap input {
        width: 140px;
        font-size: 13px;
        padding: 6px 10px 6px 30px;
      }
      .search-wrap input:focus { width: 180px; }
      .btn { padding: 6px 14px; font-size: 13px; }

      .wall-track { padding: 24px 16px 32px; }
      .wall-wrap::before,
      .wall-wrap::after { height: 32px; }

      .card { padding: 16px 18px; }
      .card-title { font-size: var(--text-sm); }
      .card-content { font-size: 13px; -webkit-line-clamp: 6; }

      .fab { bottom: 20px; right: 20px; width: 44px; height: 44px; font-size: 22px; }

      .modal { padding: 20px; max-width: 100%; margin: 10px; border-radius: var(--radius-lg); }
    }

    @media (max-width: 480px) {
      .header { flex-direction: column; padding: 10px; gap: 6px; }
      .header-center { width: 100%; }
      .search-wrap { flex: 1; }
      .search-wrap input { width: 100%; }
      .search-wrap input:focus { width: 100%; }
      .wall-track { padding: 16px 12px 24px; }
      .card { padding: 14px; }
      .card-title { font-size: 14px; }
      .card-content { font-size: 12px; -webkit-line-clamp: 5; }
    }
  </style>
</head>
<body>

  <!-- ============================================
       Header
       ============================================ -->
  <header class="header">
    <span class="header-logo">
      <svg class="icon-svg icon-svg-lg" viewBox="0 0 24 24" style="margin-right:4px">
        <path d="M12 2l2.4 7.2H22l-6 4.8 2.4 7.2L12 16l-6.4 4.8L8 14l-6-4.8h7.6z"/>
      </svg>
      灵感卡片墙
    </span>
    <div class="header-center">
      <div class="search-wrap" id="searchWrap">
        <span class="search-icon">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>

        <input type="text" id="searchInput" placeholder="搜索灵感…" autocomplete="off">
        <button class="search-clear" id="searchClear" aria-label="清除搜索">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>

  <!-- ============================================
       Masonry Wall
       ============================================ -->
  <div class="wall-wrap" id="wallWrap">
    <div class="wall-track" id="wallTrack"></div>
    <div class="empty-state" id="emptyState">
      <div class="icon">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:48px;height:48px;stroke-width:1.2">

        </svg>

    </div>

  <div class="hint-bar" id="hintBar">鼠标悬停暂停自动滚动 · 滚轮手动浏览 · 点击卡片查看详情</div>

  <!-- ============================================
       FAB
       ============================================ -->
  <button class="fab" id="fabBtn" title="新建灵感卡片">
    <svg class="icon-svg" viewBox="0 0 24 24" style="width:26px;height:26px;stroke-width:2">

  <!-- ============================================
       Modal: 新建 / 编辑卡片
       ============================================ -->
  <div class="modal-overlay" id="formModal">
    <div class="modal">
      <div class="modal-header">

      <form id="cardForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="formTitle">标题 *</label>
          <input class="form-input" id="formTitle" placeholder="给你的灵感取个名字" required maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label" for="formContent">正文 *</label>
          <textarea class="form-textarea" id="formContent" placeholder="记录你的灵感…" required maxlength="2000" rows="5"></textarea>
        </div>

  <!-- ============================================
       Modal: 查看详情
       ============================================ -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal modal-wide">
      <div class="modal-header">
        <span class="modal-title">卡片详情</span>
        <button class="modal-close" id="detailModalClose">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="detail-body" id="detailBody">
        <div class="detail-card-preview" id="detailPreview">
          <div class="detail-preview-title" id="detailTitle"></div>
          <div class="detail-preview-content" id="detailContent"></div>
          <div class="detail-preview-meta" id="detailMeta">
            <span id="detailDate"></span>
            <span id="detailColorDot"></span>
          </div>
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn btn-danger" id="detailDelete">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>
          删除
        </button>
        <button class="btn" id="detailEdit">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
          编辑
        </button>
      </div>
    </div>
  </div>

  <!-- ============================================
       Modal: 确认删除
       ============================================ -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal modal-narrow">
      <div class="confirm-dialog">
        <div class="confirm-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" style="width:44px;height:44px;stroke-width:1.5;color:var(--color-warning)">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <path d="M12 9v4M12 17h.01"/>
          </svg>
        </div>
        <div class="confirm-text">确定删除此灵感吗？</div>
        <div class="confirm-sub">删除后无法恢复，请谨慎操作</div>
        <div class="confirm-actions">
          <button class="btn" id="confirmCancel">取消</button>
          <button class="btn btn-danger" id="confirmOk">确认删除</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ============================================
       配置
       ============================================ */
    const CONFIG = {
      storageKey: 'inspiration_cards_wall_v2',
    };

    /* 莫兰迪色系预设（10种） */
    const MORANDI_COLORS = [
      { hex: '#F5E6D3', name: '暖米白' },
      { hex: '#E8D5C4', name: '杏仁白' },
      { hex: '#D4C5BC', name: '灰粉' },
      { hex: '#C9BDB8', name: '暖灰' },
      { hex: '#B8A99A', name: '卡其' },
      { hex: '#A8D5BA', name: '薄荷绿' },
      { hex: '#FCEBB5', name: '奶油黄' },
      { hex: '#F5C6A0', name: '杏色' },
      { hex: '#D5B8A1', name: '燕麦' },
      { hex: '#B5B8C3', name: '雾霾蓝' },
    ];

    /* ============================================
       State
       ============================================ */
    let cards = [];
    let isPaused = false;
    let isSearching = false;
    let scrollAnimId = null;
    let currentDetailId = null;
    let pendingDeleteId = null;
    let isStaticMode = false;
    let autoScrollEnabled = true;  // 自动滚动开关
    let wheelTimeout = null;       // 鼠标滚轮暂停恢复计时
    let currentY = 0;              // 当前 translate Y（滚轮与动画共享）
    let realContentHeight = 0;     // 原始内容高度（不含克隆）
    let selectedColor = MORANDI_COLORS[0].hex;

    /* ============================================
       DOM refs
       ============================================ */
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    const wallWrap = $('#wallWrap');
    const wallTrack = $('#wallTrack');
    const emptyState = $('#emptyState');
    const hintBar = $('#hintBar');
    const searchInput = $('#searchInput');
    const searchWrap = $('#searchWrap');
    const searchClear = $('#searchClear');
    const scrollToggle = $('#scrollToggle');
    const btnNewCard = $('#btnNewCard');
    const fabBtn = $('#fabBtn');

    const formModal = $('#formModal');
    const formModalTitle = $('#formModalTitle');
    const cardForm = $('#cardForm');
    const formTitle = $('#formTitle');
    const formContent = $('#formContent');
    const formEditId = $('#formEditId');
    const formCancel = $('#formCancel');
    const formSubmit = $('#formSubmit');
    const formModalClose = $('#formModalClose');
    const colorPresetGrid = $('#colorPresetGrid');

    const detailModal = $('#detailModal');
    const detailModalClose = $('#detailModalClose');
    const detailPreview = $('#detailPreview');
    const detailTitle = $('#detailTitle');
    const detailContent = $('#detailContent');
    const detailDate = $('#detailDate');
    const detailColorDot = $('#detailColorDot');
    const detailDelete = $('#detailDelete');
    const detailEdit = $('#detailEdit');

    const confirmModal = $('#confirmModal');
    const confirmCancel = $('#confirmCancel');
    const confirmOk = $('#confirmOk');

    /* ============================================
       Utils
       ============================================ */
    function uuid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function formatDate(iso) {
      const d = new Date(iso);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    /* ============================================
       Storage
       ============================================ */
    function loadCards() {
      try {
        const raw = localStorage.getItem(CONFIG.storageKey);
        return raw ? JSON.parse(raw) : [];
      } catch { return []; }
    }

    function saveCards() {
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(cards));
    }

    /* ============================================
       Card CRUD
       ============================================ */
    function createCard(data) {
      const now = new Date().toISOString();
      const card = {
        id: uuid(),
        title: data.title.trim(),
        content: data.content.trim(),
        color: data.color || MORANDI_COLORS[0].hex,
        createdAt: now,
        updatedAt: now,
      };
      cards.unshift(card);
      saveCards();
      return card;
    }

    function updateCard(id, data) {
      const idx = cards.findIndex((c) => c.id === id);
      if (idx === -1) return null;
      cards[idx] = {
        ...cards[idx],
        title: data.title.trim(),
        content: data.content.trim(),
        color: data.color || cards[idx].color,
        updatedAt: new Date().toISOString(),
      };
      saveCards();
      return cards[idx];
    }

    function deleteCard(id) {
      cards = cards.filter((c) => c.id !== id);
      saveCards();
    }

    function getCard(id) {
      return cards.find((c) => c.id === id);
    }

    /* ============================================
       Render
       ============================================ */
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function highlightText(text, keyword) {
      if (!keyword || !keyword.trim()) return escapeHtml(text);
      const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const parts = text.split(new RegExp(`(${escaped})`, 'gi'));
      return parts.map((part) => {
        if (part.toLowerCase() === keyword.toLowerCase()) {
          return `<span class="highlight">${escapeHtml(part)}</span>`;
        }
        return escapeHtml(part);
      }).join('');
    }

    function createCardElement(card, keyword, index) {
      const div = document.createElement('div');
      div.className = 'card';
      div.dataset.id = card.id;
      // 莫兰迪色作为卡片左侧装饰条
      div.style.borderLeft = `4px solid ${card.color}`;
      div.style.animationDelay = `${(index % 15) * 60}ms`;

      const kw = keyword || '';
      div.innerHTML = `
        <div class="card-title">${highlightText(card.title, kw)}</div>
        <div class="card-content">${highlightText(card.content, kw)}</div>
        <div class="card-footer">
          <span class="card-date">${formatDate(card.createdAt)}</span>
          <span class="card-color-dot" style="background:${card.color}"></span>
        </div>
      `;
      div.addEventListener('click', () => {
        openDetail(card.id);
      });
      div.addEventListener('mouseenter', () => { isPaused = true; });
      div.addEventListener('mouseleave', () => { isPaused = false; });

      return div;
    }

    function getFilteredCards() {
      const keyword = searchInput.value.trim();
      isSearching = !!keyword;
      if (!isSearching) return cards;
      const kw = keyword.toLowerCase();
      return cards.filter((c) =>
        c.title.toLowerCase().includes(kw) ||
        c.content.toLowerCase().includes(kw)
      );
    }

    function render(scrollToId) {
      stopScroll();
      const filtered = getFilteredCards();

      wallTrack.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.style.display = 'flex';
        hintBar.textContent = '还没有灵感卡片，点击「新建」开始记录';
        return;
      }

      emptyState.style.display = 'none';
      hintBar.textContent = isSearching
        ? `找到 ${filtered.length} 张卡片`
        : '鼠标悬停暂停自动滚动 · 滚轮手动浏览 · 点击卡片查看详情';

      filtered.forEach((card, i) => {
        wallTrack.appendChild(createCardElement(card, searchInput.value.trim(), i));
      });

      requestAnimationFrame(() => {
        decideScrollMode(filtered);

        // 编辑后定位到卡片，在同一个 rAF 帧内完成，避免跳变
        if (scrollToId) {
          requestAnimationFrame(() => {
            scrollToCard(scrollToId);
          });
        }
      });
    }

    /* ============================================
       智能滚动决策
       ============================================ */
    function decideScrollMode(filtered) {
      if (isSearching || filtered.length === 0 || !autoScrollEnabled) {
        setStaticMode(true);
        stopScroll();
        return;
      }

      const totalHeight = wallTrack.scrollHeight;
      const containerHeight = wallWrap.clientHeight;

      if (totalHeight <= containerHeight) {
        setStaticMode(true);
        stopScroll();
      } else {
        setStaticMode(false);
        startScroll(totalHeight, containerHeight);
      }
    }

    function setStaticMode(enable) {
      isStaticMode = enable;
      wallWrap.classList.toggle('static-mode', enable);
      if (enable) {
        currentY = 0;
        wallTrack.style.transform = 'translateY(0)';
        wallTrack.style.position = 'relative';
      } else {
        wallTrack.style.position = 'absolute';
      }
    }

    /* ============================================
       自动滚动 — requestAnimationFrame + translateY
       ============================================ */
    function startScroll(totalHeight, containerHeight) {
      stopScroll();

      const overflowRatio = totalHeight / containerHeight;
      const durationPerScreen = Math.max(20, 40 - (overflowRatio - 1) * 7);
      const speed = containerHeight / (durationPerScreen * 60);

      // 克隆足够填满一屏的卡片
      const cardEls = wallTrack.querySelectorAll('.card');
      const cardsToClone = [];
      let accumulatedHeight = 0;
      for (const el of cardEls) {
        accumulatedHeight += el.offsetHeight + 16;
        cardsToClone.push(el);
        if (accumulatedHeight >= containerHeight + 200) break;
      }

      wallTrack.querySelectorAll('.card-clone').forEach((el) => el.remove());

      cardsToClone.forEach((original) => {
        const clone = original.cloneNode(true);
        clone.classList.add('card-clone');
        clone.addEventListener('click', () => {
          const id = clone.dataset.id;
          if (id) openDetail(id);
        });
        wallTrack.appendChild(clone);
      });

      realContentHeight = totalHeight;
      currentY = 0;
      let lastTimestamp = 0;

      function step(timestamp) {
        if (!isPaused && !isSearching) {
          if (lastTimestamp === 0) lastTimestamp = timestamp;
          const delta = timestamp - lastTimestamp;
          lastTimestamp = timestamp;
          const frameRatio = delta / 16.67;
          currentY -= speed * frameRatio;

          if (Math.abs(currentY) >= realContentHeight) {
            currentY = 0;
          }
          wallTrack.style.transform = `translateY(${currentY}px)`;
        } else {
          lastTimestamp = 0;
        }
        scrollAnimId = requestAnimationFrame(step);
      }
      scrollAnimId = requestAnimationFrame(step);
    }

    function stopScroll() {
      if (scrollAnimId) {
        cancelAnimationFrame(scrollAnimId);
        scrollAnimId = null;
      }
      wallTrack.querySelectorAll('.card-clone').forEach((el) => el.remove());
    }

    /* ============================================
       定位到指定卡片
       ============================================ */
    function scrollToCard(cardId) {
      const cardEl = wallTrack.querySelector(`.card[data-id="${cardId}"]`);
      if (!cardEl) return;
      const cardTop = cardEl.offsetTop;
      const cardHeight = cardEl.offsetHeight;
      const containerHeight = wallWrap.clientHeight;
      // 将卡片置于视口中间偏上位置
      const targetY = Math.min(0, -(cardTop - containerHeight / 2 + cardHeight / 2));
      const maxScroll = Math.max(0, wallTrack.scrollHeight - containerHeight);
      currentY = Math.max(-maxScroll, targetY);
      wallTrack.style.transform = `translateY(${currentY}px)`;
    }

    /* ============================================
       暂停/恢复
       ============================================ */
    // 暂停/恢复逻辑已移至每个卡片元素的 mouseenter/mouseleave 事件上
    // 只有鼠标真正悬停在卡片上时才暂停自动滚动

    // 鼠标滚轮支持 — 自动/静态模式下均可手动滚动
    wallWrap.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY * 0.5;
      currentY -= delta;

      if (isStaticMode) {
        // 静态模式：正常边界，无循环
        const maxScroll = Math.max(0, wallTrack.scrollHeight - wallWrap.clientHeight);
        if (currentY > 0) currentY = 0;
        if (currentY < -maxScroll) currentY = -maxScroll;
      } else {
        // 自动滚动模式：循环边界
        if (currentY > 0) currentY = -realContentHeight;
        if (currentY < -realContentHeight) currentY = 0;
        // 暂停自动滚动，停止滚轮 2 秒后恢复
        isPaused = true;
        if (wheelTimeout) clearTimeout(wheelTimeout);
        wheelTimeout = setTimeout(() => {
          isPaused = false;
          wheelTimeout = null;
        }, 2000);
      }

      wallTrack.style.transform = `translateY(${currentY}px)`;
    }, { passive: false });

    let touchCount = 0;
    wallWrap.addEventListener('touchstart', () => {
      touchCount++;
      isPaused = true;
    }, { passive: true });
    wallWrap.addEventListener('touchend', () => {
      touchCount--;
      if (touchCount <= 0) { touchCount = 0; isPaused = false; }
    }, { passive: true });

    /* ============================================
       Search
       ============================================ */
    let searchTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchWrap.classList.toggle('has-text', !!searchInput.value.trim());
        render();
      }, 200);
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchWrap.classList.remove('has-text');
      render();
      searchInput.focus();
    });

    /* ============================================
       颜色选择器
       ============================================ */
    function renderColorPresets() {
      colorPresetGrid.innerHTML = '';
      MORANDI_COLORS.forEach((c, i) => {
        const swatch = document.createElement('div');
        swatch.className = 'color-preset-swatch';
        swatch.title = c.name;
        swatch.style.background = c.hex;
        swatch.dataset.hex = c.hex;
        if (i === 0) swatch.classList.add('active');
        swatch.addEventListener('click', () => {
          colorPresetGrid.querySelectorAll('.color-preset-swatch').forEach((s) => s.classList.remove('active'));
          swatch.classList.add('active');
          selectedColor = c.hex;
        });
        colorPresetGrid.appendChild(swatch);
      });
    }

    function setColorPreset(hex) {
      selectedColor = hex;
      colorPresetGrid.querySelectorAll('.color-preset-swatch').forEach((s) => {
        s.classList.toggle('active', s.dataset.hex === hex);
      });
    }

    /* ============================================
       Form Modal
       ============================================ */
    function openFormModal(cardId) {
      formEditId.value = cardId || '';
      if (cardId) {
        formModalTitle.textContent = '编辑灵感卡片';
        formSubmit.textContent = '更新';
        const card = getCard(cardId);
        if (card) {
          formTitle.value = card.title;
          formContent.value = card.content;
          setColorPreset(card.color);
        }
      } else {
        formModalTitle.textContent = '新建灵感卡片';
        formSubmit.textContent = '保存';
        formTitle.value = '';
        formContent.value = '';
        setColorPreset(MORANDI_COLORS[0].hex);
      }
      formModal.classList.add('active');
      setTimeout(() => formTitle.focus(), 100);
    }

    function closeFormModal() {
      formModal.classList.remove('active');
    }

    btnNewCard.addEventListener('click', () => openFormModal());
    fabBtn.addEventListener('click', () => openFormModal());
    formCancel.addEventListener('click', closeFormModal);
    formModalClose.addEventListener('click', closeFormModal);
    // 用 mousedown 而非 click：避免在输入框内拖拽选文字时，松开鼠标在遮罩上导致弹窗关闭
    formModal.addEventListener('mousedown', (e) => {
      if (e.target === formModal) closeFormModal();
    });

    cardForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = formTitle.value.trim();
      const content = formContent.value.trim();
      if (!title || !content) return;

      const editId = formEditId.value;
      if (editId) {
        updateCard(editId, { title, content, color: selectedColor });
      } else {
        createCard({ title, content, color: selectedColor });
      }
      closeFormModal();
      render(editId || undefined);
    });

    /* ============================================
       Detail Modal
       ============================================ */
    function openDetail(cardId) {
      const card = getCard(cardId);
      if (!card) return;
      currentDetailId = cardId;
      detailTitle.textContent = card.title;
      detailContent.textContent = card.content;
      detailDate.textContent = formatDate(card.createdAt);
      detailColorDot.textContent = '';
      detailColorDot.style.display = 'inline-block';
      detailColorDot.style.width = '12px';
      detailColorDot.style.height = '12px';
      detailColorDot.style.borderRadius = '50%';
      detailColorDot.style.background = card.color;
      detailColorDot.style.border = '1px solid var(--color-border-soft)';
      detailPreview.style.borderLeft = `4px solid ${card.color}`;
      detailModal.classList.add('active');
    }

    function closeDetailModal() {
      detailModal.classList.remove('active');
      currentDetailId = null;
    }

    detailModalClose.addEventListener('click', closeDetailModal);
    detailModal.addEventListener('mousedown', (e) => {
      if (e.target === detailModal) closeDetailModal();
    });

    detailEdit.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = currentDetailId;
      if (id) {
        closeDetailModal();
        openFormModal(id);
      }
    });

    detailDelete.addEventListener('click', () => {
      if (currentDetailId) {
        pendingDeleteId = currentDetailId;
        closeDetailModal();
        confirmModal.classList.add('active');
      }
    });

    /* ============================================
       Confirm Modal
       ============================================ */
    confirmCancel.addEventListener('click', () => {
      confirmModal.classList.remove('active');
      pendingDeleteId = null;
    });
    confirmModal.addEventListener('click', (e) => {
      if (e.target === confirmModal) {
        confirmModal.classList.remove('active');
        pendingDeleteId = null;
      }
    });
    confirmOk.addEventListener('click', () => {
      if (pendingDeleteId) {
        deleteCard(pendingDeleteId);
        pendingDeleteId = null;
        confirmModal.classList.remove('active');
        render();
      }
    });

    /* ============================================
       自动滚动开关
       ============================================ */
    scrollToggle.addEventListener('click', () => {
      autoScrollEnabled = !autoScrollEnabled;
      scrollToggle.classList.toggle('active', autoScrollEnabled);
      if (autoScrollEnabled) {
        scrollToggle.title = '关闭自动滚动';
      } else {
        scrollToggle.title = '开启自动滚动';
      }
      render();
    });

    /* ============================================
       Keyboard Shortcuts
       ============================================ */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirmModal.classList.contains('active')) {
          confirmModal.classList.remove('active');
          pendingDeleteId = null;
        } else if (detailModal.classList.contains('active')) {
          closeDetailModal();
        } else if (formModal.classList.contains('active')) {
          closeFormModal();
        }
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        searchInput.focus();
      }
    });

    /* ============================================
       Init
       ============================================ */
    function init() {
      cards = loadCards();
      renderColorPresets();
      // 初始状态：自动滚动开启
      scrollToggle.classList.add('active');
      scrollToggle.title = '关闭自动滚动';
      render();
    }

    init();
  </script>
</body>
</html>
