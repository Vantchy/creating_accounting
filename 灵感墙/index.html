<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感卡片墙</title>
  <style>
    /* ============================================
       CSS Reset & Base
       ============================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0a0a14;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ============================================
       Header
       ============================================ */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      background: rgba(10, 10, 20, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 10;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Search */
    .search-wrap {
      position: relative;
    }
    .search-wrap input {
      width: 200px;
      padding: 8px 14px 8px 36px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.06);
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.25s, background 0.25s, width 0.3s;
    }
    .search-wrap input::placeholder { color: rgba(255, 255, 255, 0.3); }
    .search-wrap input:focus {
      border-color: rgba(167, 139, 250, 0.5);
      background: rgba(255, 255, 255, 0.1);
      width: 260px;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.3);
      font-size: 14px;
      pointer-events: none;
    }
    .search-clear {
      display: none;
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
    }
    .search-clear:hover { color: rgba(255, 255, 255, 0.7); }
    .search-wrap.has-text .search-clear { display: block; }

    /* Btn */
    .btn {
      padding: 8px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.06);
      color: #e0e0e0;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary {
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.25), rgba(96, 165, 250, 0.25));
      border-color: rgba(167, 139, 250, 0.3);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.4), rgba(96, 165, 250, 0.4));
      border-color: rgba(167, 139, 250, 0.5);
    }
    .btn-danger {
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.5);
    }

    /* ============================================
       Conveyor Belt
       ============================================ */
    .belt-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      /* 上下留出渐变遮罩边缘 */
      padding: 32px 0;
    }
    /* 左右渐变遮罩 */
    .belt-wrap::before,
    .belt-wrap::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 80px;
      z-index: 2;
      pointer-events: none;
    }
    .belt-wrap::before {
      left: 0;
      background: linear-gradient(to right, #0a0a14 0%, transparent 100%);
    }
    .belt-wrap::after {
      right: 0;
      background: linear-gradient(to left, #0a0a14 0%, transparent 100%);
    }
    .belt-track {
      display: flex;
      gap: 24px;
      height: 100%;
      padding: 0 40px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .belt-track::-webkit-scrollbar { display: none; }

    /* ============================================
       Card
       ============================================ */
    .card {
      flex-shrink: 0;
      margin: auto 0;
      width: 280px;
      height: 380px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      padding: 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: inherit;
      z-index: 0;
      opacity: 0.6;
    }
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .card > * { position: relative; z-index: 1; }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .card-content {
      flex: 1;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.75);
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .card-source {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-source::before { content: '— '; }

    /* 搜索高亮 */
    .highlight {
      background: rgba(250, 204, 21, 0.35);
      color: #fef08a;
      border-radius: 2px;
      padding: 0 2px;
    }

    /* 空状态 */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.2);
      gap: 16px;
      pointer-events: none;
    }
    .empty-state .icon { font-size: 56px; opacity: 0.5; }
    .empty-state .text { font-size: 16px; }

    /* 底部提示 */
    .hint-bar {
      flex-shrink: 0;
      text-align: center;
      padding: 10px 0 16px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 0.5px;
    }

    /* ============================================
       Modal
       ============================================ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    .modal-overlay.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .modal {
      background: rgba(20, 20, 35, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px 32px;
      animation: slideUp 0.25s ease;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5);
    }
    .modal-wide { max-width: 600px; }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 600;
    }
    .modal-close {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.3);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }
    .modal-close:hover {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.7);
    }

    /* Form */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-input,
    .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.25s, background 0.25s;
      font-family: inherit;
    }
    .form-input:focus,
    .form-textarea:focus {
      border-color: rgba(167, 139, 250, 0.5);
      background: rgba(255, 255, 255, 0.08);
    }
    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* Color Picker */
    .color-mode-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 3px;
    }
    .color-mode-tab {
      flex: 1;
      padding: 6px 0;
      text-align: center;
      font-size: 13px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .color-mode-tab.active {
      background: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
    }
    .color-pickers { display: flex; gap: 12px; flex-wrap: wrap; }
    .color-picker-group { display: flex; flex-direction: column; gap: 4px; }
    .color-picker-group label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
    }
    .color-picker-group input[type="color"] {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      padding: 2px;
    }
    .color-picker-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-group input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }

    .angle-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .angle-group input[type="range"] {
      width: 100px;
      accent-color: #a78bfa;
    }
    .angle-value {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      min-width: 32px;
    }

    .preset-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      margin: 14px 0 8px;
    }
    .preset-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .preset-swatch {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
      position: relative;
    }
    .preset-swatch:hover {
      border-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }
    .preset-swatch.active {
      border-color: #a78bfa;
      box-shadow: 0 0 12px rgba(167, 139, 250, 0.4);
    }

    /* Detail Modal */
    .detail-body { margin-bottom: 20px; }
    .detail-card-preview {
      width: 100%;
      min-height: 180px;
      border-radius: 14px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .detail-card-preview::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: inherit;
      z-index: 0;
      opacity: 0.5;
    }
    .detail-card-preview > * { position: relative; z-index: 1; }
    .detail-card-preview .detail-preview-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .detail-card-preview .detail-preview-content {
      font-size: 15px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.8);
      word-break: break-word;
    }
    .detail-card-preview .detail-preview-source {
      margin-top: 16px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
    }
    .detail-card-preview .detail-preview-source::before { content: '— '; }
    .detail-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* Confirm Dialog */
    .confirm-dialog {
      text-align: center;
      padding: 8px 0;
    }
    .confirm-dialog .confirm-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .confirm-dialog .confirm-text {
      font-size: 16px;
      margin-bottom: 6px;
    }
    .confirm-dialog .confirm-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 24px;
    }
    .confirm-dialog .confirm-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    /* ============================================
       Responsive
       ============================================ */
    @media (max-width: 768px) {
      .header {
        padding: 14px 16px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .header-logo { font-size: 18px; }
      .header-right { flex: 1; justify-content: flex-end; }
      .search-wrap input {
        width: 140px;
        font-size: 13px;
        padding: 6px 10px 6px 30px;
      }
      .search-wrap input:focus { width: 180px; }
      .search-wrap input { width: 140px; }
      .btn { padding: 6px 14px; font-size: 13px; }

      .belt-wrap { padding: 20px 0; }
      .belt-wrap::before,
      .belt-wrap::after { width: 40px; }
      .belt-track { gap: 16px; padding: 0 20px; }

      .card {
        width: 220px;
        height: 300px;
        padding: 18px;
      }
      .card-title { font-size: 15px; }
      .card-content { font-size: 13px; -webkit-line-clamp: 5; }

      .modal { padding: 20px; max-width: 100%; margin: 10px; border-radius: 16px; }
      .modal-wide { max-width: 100%; }

      .detail-card-preview { min-height: 140px; padding: 18px; }
      .detail-card-preview .detail-preview-title { font-size: 17px; }
      .detail-card-preview .detail-preview-content { font-size: 14px; }
    }

    @media (max-width: 480px) {
      .header { flex-direction: column; align-items: stretch; }
      .header-left { justify-content: center; }
      .header-right { justify-content: center; flex-wrap: wrap; }
      .search-wrap input { width: 100%; }
      .search-wrap input:focus { width: 100%; }
      .search-wrap { flex: 1; }

      .card {
        width: 180px;
        height: 260px;
        padding: 14px;
      }
      .card-title { font-size: 14px; margin-bottom: 8px; }
      .card-content { font-size: 12px; -webkit-line-clamp: 4; }
      .card-source { font-size: 11px; margin-top: 8px; }
    }
  </style>
</head>
<body>

  <!-- ============================================
       Header
       ============================================ -->
  <header class="header">
    <div class="header-left">
      <span class="header-logo">✦ 灵感卡片墙</span>
    </div>
    <div class="header-right">
      <div class="search-wrap" id="searchWrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索灵感…" autocomplete="off">
        <button class="search-clear" id="searchClear" aria-label="清除搜索">✕</button>
      </div>
      <button class="btn btn-primary" id="btnNewCard">+ 新建</button>
    </div>
  </header>

  <!-- ============================================
       Conveyor Belt
       ============================================ -->
  <div class="belt-wrap" id="beltWrap">
    <div class="belt-track" id="beltTrack"></div>
    <div class="empty-state" id="emptyState">
      <div class="icon">✦</div>
      <div class="text">还没有灵感卡片，点击「新建」开始记录</div>
    </div>
  </div>

  <div class="hint-bar">鼠标悬停暂停 · 点击查看详情</div>

  <!-- ============================================
       Modal: 新建 / 编辑卡片
       ============================================ -->
  <div class="modal-overlay" id="formModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="formModalTitle">新建灵感卡片</span>
        <button class="modal-close" id="formModalClose">✕</button>
      </div>
      <form id="cardForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="formTitle">标题 *</label>
          <input class="form-input" id="formTitle" placeholder="给你的灵感取个名字" required maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label" for="formContent">正文 *</label>
          <textarea class="form-textarea" id="formContent" placeholder="记录你的灵感…" required maxlength="2000"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="formSource">来源</label>
          <input class="form-input" id="formSource" placeholder="可选，如书籍、电影、自己" maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label">卡片背景色</label>
          <div class="color-mode-tabs">
            <button class="color-mode-tab active" data-mode="solid" type="button">纯色</button>
            <button class="color-mode-tab" data-mode="gradient" type="button">渐变</button>
          </div>
          <div id="colorSolidGroup">
            <div class="color-pickers">
              <div class="color-picker-group">
                <label>颜色</label>
                <input type="color" id="colorSolid" value="#6c5ce7">
              </div>
            </div>
          </div>
          <div id="colorGradientGroup" style="display:none;">
            <div class="color-pickers">
              <div class="color-picker-group">
                <label>颜色 1</label>
                <input type="color" id="colorGrad1" value="#667eea">
              </div>
              <div class="color-picker-group">
                <label>颜色 2</label>
                <input type="color" id="colorGrad2" value="#764ba2">
              </div>
              <div class="color-picker-group">
                <label>角度</label>
                <div class="angle-group">
                  <input type="range" id="colorAngle" min="0" max="360" value="135">
                  <span class="angle-value" id="angleDisplay">135°</span>
                </div>
              </div>
            </div>
          </div>
          <div class="preset-label">预设色板</div>
          <div class="preset-grid" id="presetGrid"></div>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;">
          <button class="btn" type="button" id="formCancel">取消</button>
          <button class="btn btn-primary" type="submit" id="formSubmit">保存</button>
        </div>
        <input type="hidden" id="formEditId" value="">
      </form>
    </div>
  </div>

  <!-- ============================================
       Modal: 查看详情
       ============================================ -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal modal-wide">
      <div class="modal-header">
        <span class="modal-title">卡片详情</span>
        <button class="modal-close" id="detailModalClose">✕</button>
      </div>
      <div class="detail-body" id="detailBody">
        <div class="detail-card-preview" id="detailPreview">
          <div class="detail-preview-title" id="detailTitle"></div>
          <div class="detail-preview-content" id="detailContent"></div>
          <div class="detail-preview-source" id="detailSource"></div>
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn btn-danger" id="detailDelete">🗑 删除</button>
        <button class="btn" id="detailEdit">✎ 编辑</button>
      </div>
    </div>
  </div>

  <!-- ============================================
       Modal: 确认删除
       ============================================ -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width:380px;">
      <div class="confirm-dialog">
        <div class="confirm-icon">⚠️</div>
        <div class="confirm-text">确认删除这张卡片？</div>
        <div class="confirm-sub">删除后无法恢复，请谨慎操作</div>
        <div class="confirm-actions">
          <button class="btn" id="confirmCancel">取消</button>
          <button class="btn btn-danger" id="confirmOk">确认删除</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ============================================
       Config — 可扩展端口
       ============================================ */
    const CONFIG = {
      storageKey: 'inspiration_cards',
      scrollSpeed: 0.8,         // 像素/帧 — 可扩展为速度调节
      cardWidth: 280,           // 与 CSS 保持一致
      cardGap: 24,              // 与 CSS 保持一致
      sortOrder: 'createdAt',   // 排序字段 — 可扩展为多种排序
      sortDir: 'desc',          // 排序方向 — 可扩展
    };

    /* ============================================
       State
       ============================================ */
    let cards = [];
    let isPaused = false;
    let isSearching = false;
    let scrollAnimId = null;
    let scrollDirection = 1;   // 1=正向, -1=反向（往复滚动用）
    let currentDetailId = null;
    let pendingDeleteId = null;

    /* ============================================
       DOM refs
       ============================================ */
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const beltWrap = $('#beltWrap');
    const beltTrack = $('#beltTrack');
    const emptyState = $('#emptyState');
    const searchInput = $('#searchInput');
    const searchWrap = $('#searchWrap');
    const searchClear = $('#searchClear');
    const btnNewCard = $('#btnNewCard');

    // Form modal
    const formModal = $('#formModal');
    const formModalTitle = $('#formModalTitle');
    const cardForm = $('#cardForm');
    const formTitle = $('#formTitle');
    const formContent = $('#formContent');
    const formSource = $('#formSource');
    const formEditId = $('#formEditId');
    const formCancel = $('#formCancel');
    const formSubmit = $('#formSubmit');
    const formModalClose = $('#formModalClose');

    // Color
    const colorModeTabs = $$('.color-mode-tab');
    const colorSolidGroup = $('#colorSolidGroup');
    const colorGradientGroup = $('#colorGradientGroup');
    const colorSolid = $('#colorSolid');
    const colorGrad1 = $('#colorGrad1');
    const colorGrad2 = $('#colorGrad2');
    const colorAngle = $('#colorAngle');
    const angleDisplay = $('#angleDisplay');
    const presetGrid = $('#presetGrid');

    // Detail modal
    const detailModal = $('#detailModal');
    const detailModalClose = $('#detailModalClose');
    const detailPreview = $('#detailPreview');
    const detailTitle = $('#detailTitle');
    const detailContent = $('#detailContent');
    const detailSource = $('#detailSource');
    const detailDelete = $('#detailDelete');
    const detailEdit = $('#detailEdit');

    // Confirm modal
    const confirmModal = $('#confirmModal');
    const confirmCancel = $('#confirmCancel');
    const confirmOk = $('#confirmOk');

    /* ============================================
       Presets — 可扩展端口
       ============================================ */
    const PRESETS = [
      // 纯色
      { type: 'solid', color1: '#2d3436', label: '深灰' },
      { type: 'solid', color1: '#6c5ce7', label: '紫' },
      { type: 'solid', color1: '#00b894', label: '绿' },
      { type: 'solid', color1: '#fd79a8', label: '粉' },
      { type: 'solid', color1: '#0984e3', label: '蓝' },
      { type: 'solid', color1: '#e17055', label: '橙' },
      { type: 'solid', color1: '#00cec9', label: '青' },
      { type: 'solid', color1: '#a29bfe', label: '淡紫' },
      // 渐变
      { type: 'gradient', color1: '#ff6b6b', color2: '#ffa500', angle: 0, label: '日落' },
      { type: 'gradient', color1: '#2193b0', color2: '#6dd5ed', angle: 135, label: '海洋' },
      { type: 'gradient', color1: '#667eea', color2: '#764ba2', angle: 135, label: '极光紫' },
      { type: 'gradient', color1: '#11998e', color2: '#38ef7d', angle: 135, label: '森林' },
      { type: 'gradient', color1: '#f093fb', color2: '#f5576c', angle: 135, label: '霓虹' },
      { type: 'gradient', color1: '#00b4db', color2: '#0083b0', angle: 135, label: '深海' },
      { type: 'gradient', color1: '#8E2DE2', color2: '#4A00E0', angle: 135, label: '星云' },
      { type: 'gradient', color1: '#eb3349', color2: '#f45c43', angle: 135, label: '烈焰' },
    ];

    /* ============================================
       Utils
       ============================================ */
    function uuid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function getBgStyle(bg) {
      if (!bg) return 'background: rgba(255,255,255,0.05);';
      if (bg.type === 'solid') {
        return `background: ${bg.color1};`;
      }
      return `background: linear-gradient(${bg.angle}deg, ${bg.color1}, ${bg.color2});`;
    }

    function getBgCss(bg) {
      if (!bg) return 'rgba(255,255,255,0.05)';
      if (bg.type === 'solid') return bg.color1;
      return `linear-gradient(${bg.angle}deg, ${bg.color1}, ${bg.color2})`;
    }

    /* ============================================
       Storage
       ============================================ */
    function loadCards() {
      try {
        const raw = localStorage.getItem(CONFIG.storageKey);
        return raw ? JSON.parse(raw) : [];
      } catch { return []; }
    }

    function saveCards() {
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(cards));
    }

    /* ============================================
       Card CRUD
       ============================================ */
    function createCard(data) {
      const now = new Date().toISOString();
      const card = {
        id: uuid(),
        title: data.title.trim(),
        content: data.content.trim(),
        source: data.source ? data.source.trim() : '',
        bg: data.bg || { type: 'solid', color1: '#6c5ce7' },
        createdAt: now,
        updatedAt: now,
      };
      cards.unshift(card); // 最新在前
      saveCards();
      return card;
    }

    function updateCard(id, data) {
      const idx = cards.findIndex((c) => c.id === id);
      if (idx === -1) return null;
      cards[idx] = {
        ...cards[idx],
        title: data.title.trim(),
        content: data.content.trim(),
        source: data.source ? data.source.trim() : '',
        bg: data.bg || cards[idx].bg,
        updatedAt: new Date().toISOString(),
      };
      saveCards();
      return cards[idx];
    }

    function deleteCard(id) {
      cards = cards.filter((c) => c.id !== id);
      saveCards();
    }

    function getCard(id) {
      return cards.find((c) => c.id === id);
    }

    /* ============================================
       Render
       ============================================ */
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function highlightText(text, keyword) {
      if (!keyword || !keyword.trim()) return escapeHtml(text);
      const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const parts = text.split(new RegExp(`(${escapedKeyword})`, 'gi'));
      return parts.map((part) => {
        if (part.toLowerCase() === keyword.toLowerCase()) {
          return `<span class="highlight">${escapeHtml(part)}</span>`;
        }
        return escapeHtml(part);
      }).join('');
    }

    function createCardElement(card, keyword) {
      const div = document.createElement('div');
      div.className = 'card';
      div.dataset.id = card.id;
      div.style.cssText = getBgStyle(card.bg);

      const kw = keyword || '';
      div.innerHTML = `
        <div class="card-title">${highlightText(card.title, kw)}</div>
        <div class="card-content">${highlightText(card.content, kw)}</div>
        ${card.source ? `<div class="card-source">${highlightText(card.source, kw)}</div>` : ''}
      `;
      div.addEventListener('click', () => openDetail(card.id));
      return div;
    }

    function render() {
      const keyword = searchInput.value.trim();
      isSearching = !!keyword;

      let filtered = cards;
      if (isSearching) {
        const kw = keyword.toLowerCase();
        filtered = cards.filter((c) =>
          c.title.toLowerCase().includes(kw) ||
          c.content.toLowerCase().includes(kw)
        );
      }

      beltTrack.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.style.display = 'flex';
        beltTrack.style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      beltTrack.style.display = 'flex';

      // 渲染真实卡片
      filtered.forEach((card) => {
        beltTrack.appendChild(createCardElement(card, keyword));
      });

      // 卡片 ≥ 4 张时：克隆视口可见的前几张，实现无缝循环
      const cardCount = filtered.length;
      const cardTotalWidth = CONFIG.cardWidth + CONFIG.cardGap;
      const visibleCount = Math.ceil(beltWrap.clientWidth / cardTotalWidth);
      if (cardCount >= 4) {
        const cloneCount = Math.min(visibleCount, cardCount);
        for (let i = 0; i < cloneCount; i++) {
          beltTrack.appendChild(createCardElement(filtered[i], keyword));
        }
      }

      // 搜索状态下不滚动
      if (isSearching) {
        beltTrack.scrollLeft = 0;
        stopScroll();
      } else {
        startScroll();
      }
    }

    /* ============================================
       Auto Scroll — 可扩展端口
       ============================================ */
    function startScroll() {
      stopScroll();
      if (isSearching) return;
      if (cards.length === 0) return;

      const cardCount = cards.length;
      let lastTime = 0;

      function step(timestamp) {
        if (!isPaused && !isSearching && cards.length > 0) {
          // 根据帧间隔时间归一化速度，确保不同帧率下滚动匀速
          if (lastTime === 0) lastTime = timestamp;
          const delta = timestamp - lastTime;
          lastTime = timestamp;
          const speed = CONFIG.scrollSpeed * (delta / 16.67); // 归一化到 60fps
          beltTrack.scrollLeft += speed * scrollDirection;

          if (cardCount >= 4) {
            // 方案一：克隆跳跃 — 到达克隆区起点时跳回
            const cardEls = beltTrack.querySelectorAll('.card');
            const realCards = cardCount;
            const realWidth = cardEls[realCards - 1].offsetLeft + cardEls[realCards - 1].offsetWidth - cardEls[0].offsetLeft;
            if (beltTrack.scrollLeft >= cardEls[0].offsetLeft + realWidth) {
              beltTrack.scrollLeft -= realWidth;
            }
          } else if (cardCount >= 2) {
            // 方案二：往复滚动 — 到终点/起点时反向
            if (beltTrack.scrollLeft >= beltTrack.scrollWidth - beltTrack.clientWidth - 1) {
              scrollDirection = -1;
            } else if (beltTrack.scrollLeft <= 0) {
              scrollDirection = 1;
            }
          }
          // 方案三：仅 1 张卡片 → 不滚动（不做任何事）
        }
        scrollAnimId = requestAnimationFrame(step);
      }
      scrollAnimId = requestAnimationFrame(step);
    }

    function stopScroll() {
      if (scrollAnimId) {
        cancelAnimationFrame(scrollAnimId);
        scrollAnimId = null;
      }
    }

    // 鼠标/触摸暂停
    beltWrap.addEventListener('mouseenter', () => { isPaused = true; });
    beltWrap.addEventListener('mouseleave', () => { isPaused = false; });

    // 移动端触摸暂停
    let touchCount = 0;
    beltWrap.addEventListener('touchstart', () => {
      touchCount++;
      isPaused = true;
    }, { passive: true });
    beltWrap.addEventListener('touchend', () => {
      touchCount--;
      if (touchCount <= 0) {
        touchCount = 0;
        isPaused = false;
      }
    }, { passive: true });

    /* ============================================
       Search
       ============================================ */
    let searchTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchWrap.classList.toggle('has-text', !!searchInput.value.trim());
        render();
      }, 200);
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchWrap.classList.remove('has-text');
      render();
      searchInput.focus();
    });

    /* ============================================
       Color Picker
       ============================================ */
    let currentColorMode = 'solid';

    colorModeTabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        colorModeTabs.forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        currentColorMode = tab.dataset.mode;
        colorSolidGroup.style.display = currentColorMode === 'solid' ? 'block' : 'none';
        colorGradientGroup.style.display = currentColorMode === 'gradient' ? 'block' : 'none';
      });
    });

    colorAngle.addEventListener('input', () => {
      angleDisplay.textContent = colorAngle.value + '°';
    });

    function getColorConfig() {
      if (currentColorMode === 'solid') {
        return { type: 'solid', color1: colorSolid.value };
      }
      return {
        type: 'gradient',
        color1: colorGrad1.value,
        color2: colorGrad2.value,
        angle: parseInt(colorAngle.value, 10),
      };
    }

    function setColorConfig(bg) {
      if (!bg) {
        currentColorMode = 'solid';
        colorSolid.value = '#6c5ce7';
        colorGrad1.value = '#667eea';
        colorGrad2.value = '#764ba2';
        colorAngle.value = '135';
        angleDisplay.textContent = '135°';
      } else if (bg.type === 'solid') {
        currentColorMode = 'solid';
        colorSolid.value = bg.color1;
      } else {
        currentColorMode = 'gradient';
        colorGrad1.value = bg.color1;
        colorGrad2.value = bg.color2 || '#764ba2';
        colorAngle.value = (bg.angle || 135).toString();
        angleDisplay.textContent = colorAngle.value + '°';
      }
      // 更新 UI
      colorModeTabs.forEach((t) => {
        t.classList.toggle('active', t.dataset.mode === currentColorMode);
      });
      colorSolidGroup.style.display = currentColorMode === 'solid' ? 'block' : 'none';
      colorGradientGroup.style.display = currentColorMode === 'gradient' ? 'block' : 'none';
    }

    /* ============================================
       Presets
       ============================================ */
    function renderPresets() {
      presetGrid.innerHTML = '';
      PRESETS.forEach((p, i) => {
        const swatch = document.createElement('div');
        swatch.className = 'preset-swatch';
        swatch.title = p.label;
        if (p.type === 'solid') {
          swatch.style.background = p.color1;
        } else {
          swatch.style.background = `linear-gradient(${p.angle}deg, ${p.color1}, ${p.color2})`;
        }
        swatch.dataset.index = i;
        swatch.addEventListener('click', () => {
          presetGrid.querySelectorAll('.preset-swatch').forEach((s) => s.classList.remove('active'));
          swatch.classList.add('active');
          applyPreset(p);
        });
        presetGrid.appendChild(swatch);
      });
    }

    function applyPreset(p) {
      if (p.type === 'solid') {
        currentColorMode = 'solid';
        colorSolid.value = p.color1;
        colorModeTabs.forEach((t) => {
          t.classList.toggle('active', t.dataset.mode === 'solid');
        });
        colorSolidGroup.style.display = 'block';
        colorGradientGroup.style.display = 'none';
      } else {
        currentColorMode = 'gradient';
        colorGrad1.value = p.color1;
        colorGrad2.value = p.color2;
        colorAngle.value = (p.angle || 135).toString();
        angleDisplay.textContent = colorAngle.value + '°';
        colorModeTabs.forEach((t) => {
          t.classList.toggle('active', t.dataset.mode === 'gradient');
        });
        colorSolidGroup.style.display = 'none';
        colorGradientGroup.style.display = 'block';
      }
    }

    /* ============================================
       Form Modal
       ============================================ */
    function openFormModal(cardId) {
      formEditId.value = cardId || '';
      if (cardId) {
        formModalTitle.textContent = '编辑灵感卡片';
        formSubmit.textContent = '更新';
        const card = getCard(cardId);
        if (card) {
          formTitle.value = card.title;
          formContent.value = card.content;
          formSource.value = card.source || '';
          setColorConfig(card.bg);
        }
      } else {
        formModalTitle.textContent = '新建灵感卡片';
        formSubmit.textContent = '保存';
        formTitle.value = '';
        formContent.value = '';
        formSource.value = '';
        setColorConfig(null);
        // 清除预设高亮
        presetGrid.querySelectorAll('.preset-swatch').forEach((s) => s.classList.remove('active'));
      }
      formModal.classList.add('active');
      setTimeout(() => formTitle.focus(), 100);
    }

    function closeFormModal() {
      formModal.classList.remove('active');
    }

    btnNewCard.addEventListener('click', () => openFormModal());
    formCancel.addEventListener('click', closeFormModal);
    formModalClose.addEventListener('click', closeFormModal);
    formModal.addEventListener('click', (e) => {
      if (e.target === formModal) closeFormModal();
    });

    cardForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = formTitle.value.trim();
      const content = formContent.value.trim();
      if (!title || !content) return;

      const bg = getColorConfig();
      const editId = formEditId.value;

      if (editId) {
        updateCard(editId, { title, content, source: formSource.value.trim(), bg });
      } else {
        createCard({ title, content, source: formSource.value.trim(), bg });
      }

      closeFormModal();
      render();
    });

    /* ============================================
       Detail Modal
       ============================================ */
    function openDetail(cardId) {
      const card = getCard(cardId);
      if (!card) return;
      currentDetailId = cardId;
      detailTitle.textContent = card.title;
      detailContent.textContent = card.content;
      detailSource.textContent = card.source || '';
      detailPreview.style.cssText = getBgStyle(card.bg);
      detailModal.classList.add('active');
    }

    function closeDetailModal() {
      detailModal.classList.remove('active');
      currentDetailId = null;
    }

    detailModalClose.addEventListener('click', closeDetailModal);
    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) closeDetailModal();
    });

    detailEdit.addEventListener('click', () => {
      const id = currentDetailId;
      if (id) {
        closeDetailModal();
        openFormModal(id);
      }
    });

    detailDelete.addEventListener('click', () => {
      if (currentDetailId) {
        pendingDeleteId = currentDetailId;
        closeDetailModal();
        confirmModal.classList.add('active');
      }
    });

    /* ============================================
       Confirm Modal
       ============================================ */
    confirmCancel.addEventListener('click', () => {
      confirmModal.classList.remove('active');
      pendingDeleteId = null;
    });
    confirmModal.addEventListener('click', (e) => {
      if (e.target === confirmModal) {
        confirmModal.classList.remove('active');
        pendingDeleteId = null;
      }
    });

    confirmOk.addEventListener('click', () => {
      if (pendingDeleteId) {
        deleteCard(pendingDeleteId);
        pendingDeleteId = null;
        confirmModal.classList.remove('active');
        render();
      }
    });

    /* ============================================
       Keyboard Shortcuts
       ============================================ */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirmModal.classList.contains('active')) {
          confirmModal.classList.remove('active');
          pendingDeleteId = null;
        } else if (detailModal.classList.contains('active')) {
          closeDetailModal();
        } else if (formModal.classList.contains('active')) {
          closeFormModal();
        }
      }
      // Ctrl/Cmd + K: 聚焦搜索
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        searchInput.focus();
      }
    });

    /* ============================================
       Init
       ============================================ */
    function init() {
      cards = loadCards();
      renderPresets();
      render();
    }

    init();

    /* ============================================
       可扩展端口注释
       ============================================
       [1] 排序: 修改 CONFIG.sortOrder / sortDir, 在 render()
           中 cards 读取后加排序逻辑即可
       [2] 标签分类: 数据模型加 tags 字段, 渲染时按标签过滤
       [3] 导入/导出: 在 header 加按钮, 调用 JSON.stringify/parse
       [4] 滚动速度调节: CONFIG.scrollSpeed 改为动态值,
           可在 UI 加滑块调节
       [5] 多列传送带: 修改 CSS .belt-track 为 grid 布局,
           并调整滚动逻辑
       [6] 拖拽排序: 加 drag 事件, 更新 cards 顺序后 saveCards()
       ============================================ */
  </script>
</body>
</html>
